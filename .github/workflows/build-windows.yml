name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack and install pnpm
        run: |
          npm install -g pnpm@10
          pnpm --version
        shell: cmd

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        shell: cmd

      - name: Build Next.js standalone
        run: pnpm build
        shell: cmd

      - name: Copy static assets into standalone
        run: node scripts/post-build.js
        shell: cmd

      - name: Init SQLite database
        run: pnpm db:init
        shell: cmd

      - name: Build Electron installer (.exe)
        run: pnpm exec electron-builder --win --x64
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist-electron
        run: dir dist-electron
        shell: cmd

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactureStock-Windows-EXE
          path: dist-electron/*.exe
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FactureStock v1.0.${{ github.run_number }}"
          body: |
            ## FactureStock — Installateur Windows Standalone

            ### ⬇️ Télécharger
            Cliquer sur **FactureStock-Setup-1.0.0.exe** ci-dessous

            ### Installation (PC serveur)
            1. Double-cliquer sur le `.exe`
            2. Suivre l'assistant → Installer
            3. Lancer FactureStock depuis le Bureau

            ### Connexion par défaut
            - Email : `admin@facturestock.ma`
            - Mot de passe : `admin123`

            ### Accès réseau (autres PC)
            L'adresse réseau s'affiche au démarrage.
            Ouvrir Chrome sur les autres PC et taper cette adresse.

            ---
            ✅ **Standalone** — Node.js intégré, aucune installation requise sur le PC cible
          files: dist-electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
