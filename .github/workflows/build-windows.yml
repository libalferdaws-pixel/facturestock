name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10
        shell: cmd

      - name: Configure node-gyp to use VS 2022
        run: |
          npm config set msvs_version 2022
          pnpm config set msvs_version 2022
        shell: cmd

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        shell: cmd
        env:
          npm_config_msvs_version: '2022'
          MSVS_VERSION: '2022'

      - name: Build Next.js standalone
        run: pnpm build
        shell: cmd

      - name: Copy static assets into standalone
        run: node scripts/post-build.js
        shell: cmd

      - name: Init SQLite database
        run: pnpm db:init
        shell: cmd

      - name: Build Electron installer (.exe)
        run: pnpm exec electron-builder --win --x64
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist-electron
        run: dir dist-electron
        shell: cmd

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactureStock-Windows-EXE
          path: dist-electron/*.exe
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FactureStock v1.0.${{ github.run_number }}"
          body: |
            ## FactureStock — Installateur Windows Standalone

            ### ⬇️ Télécharger
            Cliquer sur **FactureStock-Setup-1.0.0.exe** ci-dessous

            ### Installation
            1. Double-cliquer le `.exe`
            2. Suivre l'assistant → Installer
            3. Lancer depuis le Bureau

            ### Connexion par défaut
            - Email : `admin@facturestock.ma`
            - Mot de passe : `admin123`

            ### Accès réseau
            L'adresse réseau s'affiche au démarrage — ouvrir Chrome sur les autres PC.

            ✅ **Standalone** — Node.js intégré, aucune installation requise
          files: dist-electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
