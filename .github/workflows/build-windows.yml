name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install Visual C++ Build Tools (for better-sqlite3)
        run: |
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools" -y
        shell: powershell

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (standalone)
        run: pnpm build

      - name: Copy static assets into standalone
        run: node scripts/post-build.js

      - name: Init SQLite database
        run: pnpm db:init

      - name: Build Electron installer (.exe)
        run: pnpm exec electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactureStock-Windows-EXE
          path: dist-electron/*.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FactureStock v1.0.${{ github.run_number }}"
          body: |
            ## FactureStock — Installateur Windows Standalone

            ### Télécharger
            👇 Cliquer sur **FactureStock-Setup-1.0.0.exe** ci-dessous

            ### Installation
            1. Double-cliquer sur le `.exe`
            2. Suivre l'assistant d'installation
            3. Lancer FactureStock depuis le Bureau

            ### Connexion par défaut
            - Email : `admin@facturestock.ma`
            - Mot de passe : `admin123`

            ### Accès réseau (autres PC)
            L'adresse réseau s'affiche au démarrage — ouvrir Chrome sur les autres PC et taper cette adresse.

            ---
            ✅ **Standalone** — Node.js intégré, aucune installation requise
          files: dist-electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
